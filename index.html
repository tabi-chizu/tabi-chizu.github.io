<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ふたりの旅地図</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https://cyberjapandata.gsi.go.jp; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://msearch.gsi.go.jp; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<header id="top">
  <h1>ふたりの旅地図</h1>
  <button type="button" id="syncBadge" class="badge" data-act="sync" hidden></button>
  <button type="button" class="icon-btn" data-act="settings" aria-label="設定" data-icon="gear"></button>
</header>
<main id="main"></main>
<nav aria-label="画面の切り替え">
  <button type="button" data-act="go" data-tab="map" data-icon="map">地図</button>
  <button type="button" data-act="go" data-tab="near" data-icon="near">近く</button>
  <button type="button" data-act="go" data-tab="collect" data-icon="book">集める</button>
  <button type="button" data-act="go" data-tab="titles" data-icon="award">称号</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>JavaScript を有効にしてください。</noscript>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
